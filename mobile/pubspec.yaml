name: il_mio_cioccolato
description: Multi-brand store menu tablet app
publish_to: 'none'
version: 2.1.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.1.1
  cached_network_image: ^3.3.0
  flutter_spinkit: ^5.2.0
  package_info_plus: ^8.1.2
  ota_update: ^7.0.2
  flutter_secure_storage: 10.0.0
  path_provider: 2.1.5
  mobile_scanner: ^7.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
  adaptive_icon_background: "#8B4513"
  adaptive_icon_foreground: "icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-OFL.txt
    - assets/fonts/dirham-LICENSE.txt
  fonts:
    - family: DirhamPrice
      fonts:
        - asset: assets/fonts/dirham-price-700.ttf
          weight: 700
        - asset: assets/fonts/dirham-price-800.ttf
          weight: 800
        - asset: assets/fonts/dirham-price-900.ttf
          weight: 900
    - family: Dirham
      fonts:
        - asset: assets/fonts/dirham.ttf
